<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PD&amp;I ANP | ESCALAB</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E8F2EE; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1B2421; padding: 16px; }
  .box { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(16, 40, 32, .12); overflow: hidden; }
  .top { background: linear-gradient(90deg, #0C6A4E, #0E7858); color: #fff; padding: 22px 24px; }
  .top h1 { margin: 0; font-size: 20px; font-weight: 700; }
  .top p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  form { padding: 22px 24px 24px; display: grid; gap: 12px; }
  label { font-size: 13px; color: #5E6B66; }
  input[type=password] { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid #DCE3DF; border-radius: 10px; }
  input[type=password]:focus { outline: 2px solid #7CC4A6; border-color: #0F7A5A; }
  .rem { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #5E6B66; }
  button { font: inherit; font-weight: 600; background: #0F7A5A; color: #fff; border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.2em; font-size: 13px; margin: 0; }
  .msg.err { color: #C2412D; }
  .bar { height: 4px; background: #E7ECE9; border-radius: 4px; overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: #0F7A5A; transition: width .2s; }
</style>
</head>
<body>
<div class="box">
  <div class="top"><h1>PD&amp;I ANP | ESCALAB</h1><p>Painel interno. Digite a senha recebida da equipe.</p></div>
  <form id="f" autocomplete="off">
    <label for="pw">Senha</label>
    <input id="pw" type="password" autofocus>
    <label class="rem"><input id="rem" type="checkbox"> Lembrar neste computador por 30 dias</label>
    <button id="go" type="submit">Entrar</button>
    <div class="bar" id="bar"><i id="barfill"></i></div>
    <p class="msg" id="msg"></p>
  </form>
</div>
<script>
(function () {
  var CFG = {"salt": "sWysXZNA1nxSk3XsfDrdWA==", "iv": "dEFnRcyWLGvB0JPa", "iter": 250000, "file": "painel.bin", "size": 1313903, "v": "af3d48a443"};
  var KEY = 'pdi_painel_chave_' + CFG.v;
  var f = document.getElementById('f'), pw = document.getElementById('pw'), rem = document.getElementById('rem');
  var go = document.getElementById('go'), msg = document.getElementById('msg'), bar = document.getElementById('bar'), fill = document.getElementById('barfill');
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function say(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    say('Este navegador é antigo demais para abrir o painel. Use Chrome, Edge ou Firefox atualizados.', true);
    go.disabled = true; return;
  }
  var blobPromise = null;
  function fetchBlob() {
    if (blobPromise) return blobPromise;
    blobPromise = fetch(CFG.file + '?v=' + CFG.v, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var total = Number(r.headers.get('content-length')) || CFG.size;
      if (!r.body || !r.body.getReader) return r.arrayBuffer();
      var reader = r.body.getReader(), got = 0, parts = [];
      bar.style.display = 'block';
      function pump() {
        return reader.read().then(function (x) {
          if (x.done) { var out = new Uint8Array(got), o = 0; parts.forEach(function (p) { out.set(p, o); o += p.length; }); return out.buffer; }
          parts.push(x.value); got += x.value.length; fill.style.width = Math.min(100, got / total * 100) + '%';
          return pump();
        });
      }
      return pump();
    });
    blobPromise.catch(function () { blobPromise = null; });
    return blobPromise;
  }
  async function keyFromPassword(p) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  async function open(raw, remember) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var buf = await fetchBlob();
    var plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(CFG.iv) }, key, buf);
    } catch (e) { return false; }
    if (remember) {
      try { localStorage.setItem(KEY, JSON.stringify({ k: btoa(String.fromCharCode.apply(null, raw)), exp: Date.now() + 30 * 864e5 })); } catch (e) {}
    }
    say('Abrindo o painel...');
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
    return true;
  }
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!pw.value) { say('Digite a senha.', true); return; }
    go.disabled = true; say('Conferindo a senha...');
    try {
      var raw = await keyFromPassword(pw.value);
      say('Baixando o painel...');
      var ok = await open(raw, rem.checked);
      if (!ok) { say('Senha incorreta.', true); go.disabled = false; pw.select(); }
    } catch (err) {
      say('Não foi possível carregar o painel (' + err.message + '). Recarregue a página e tente de novo.', true);
      go.disabled = false;
    }
  });
  // Entrada automática se a senha foi lembrada
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.exp > Date.now()) {
      go.disabled = true; say('Abrindo o painel...');
      open(b64(saved.k), false).then(function (ok) {
        if (!ok) { localStorage.removeItem(KEY); go.disabled = false; say(''); }
      }).catch(function () { go.disabled = false; say(''); });
    } else if (saved) { localStorage.removeItem(KEY); }
  } catch (e) {}
  fetchBlob().catch(function () {});
})();
</script>
</body>
</html>
